name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tests, build and a syntax check of the generated Code.gs.
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: dist-gas
          path: dist/gas/
